[project]
name = "paperless_ngx_mcp"
version = "0.1.1"
description = "Standalone MCP server exposing the Paperless-ngx REST API over HTTP"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "fastmcp>=3.4,<4",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[tool.uv]
# Single-module app; install only the dependencies (no build backend needed).
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
