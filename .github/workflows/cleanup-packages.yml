name: Cleanup untagged images

# Multi-arch builds leave orphaned, untagged manifests in GHCR every push.
# Prune only those — tagged images (:latest, :<branch>, :v*) are never touched.
# Auth uses the built-in GITHUB_TOKEN; no secrets to configure.

on:
  schedule:
    - cron: "0 3 * * 0"   # weekly, Sunday 03:00 UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: paperless-ngx-mcp
          package-type: container
          delete-only-untagged-versions: "true"
