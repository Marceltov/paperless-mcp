# paperless-mcp next to an existing Paperless-ngx, as its own compose project.
# Copy .env.example to .env, adjust it, then: docker compose up -d
services:
  paperless-mcp:
    image: ghcr.io/marceltov/paperless-mcp:latest
    container_name: paperless-mcp
    restart: unless-stopped
    env_file: .env
    volumes:
      # OAuth logins survive container updates (unused with tokens only).
      - mcp-oauth:/data
    ports:
      - "8081:8081"
    networks:
      - paperless

networks:
  # The Docker network your Paperless-ngx container is already on.
  paperless:
    external: true
    name: ${PAPERLESS_NETWORK:?set PAPERLESS_NETWORK in .env}

volumes:
  mcp-oauth:
